# ============================================================
#  Decap CMS settings: your writing dashboard at /admin/
#  Edit the 3 lines marked  <-- CHANGE  and you are done.
# ============================================================
backend:
  name: github
  repo: Mukesh39/mindbogling   # <-- CHANGE (e.g. rahul/my-blog)
  branch: main

  # --- Only if you host on CLOUDFLARE PAGES: remove the two # below and set your address ---
  # base_url: https://YOUR-SITE.pages.dev       # <-- CHANGE
  # auth_endpoint: oauth/auth
  # (On NETLIFY leave both lines commented out.)

local_backend: true          # lets you test /admin on your own computer (npx decap-server)
publish_mode: simple         # Publish = goes live in about a minute
media_folder: src/assets/uploads
public_folder: ../../assets/uploads
# media_library:
#   name: default
#   config:
#     max_file_size: 1500000   # blocks uploads over ~1.5 MB so the site stays fast

collections:
  # ---------- Sections (Economy, Geography, ...) ----------
  - name: categories
    label: Sections
    label_singular: Section
    folder: src/content/categories
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - { label: Section name, name: name, widget: string, hint: "e.g. History. The web address is made from this name." }
      - { label: Short description, name: description, widget: text, required: false }
      - { label: Colour, name: color, widget: color, default: "#1F4FD8" }
      - { label: Menu order, name: order, widget: number, default: 10, value_type: int, hint: "Smaller numbers appear first." }

  # ---------- Articles ----------
  - name: blog
    label: Articles
    label_singular: Article
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: [date, title, category]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Section
        name: category
        widget: relation
        collection: categories
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
      - { label: Short summary (shown on cards and Google), name: excerpt, widget: text }
      - { label: Cover image, name: cover, widget: image, required: false, choose_url: false, hint: "Best size: 1600 x 840 pixels, under 1.5 MB." }
      - { label: Cover image description (for screen readers), name: coverAlt, widget: string, required: false }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Author, name: author, widget: string, default: "Your Name" }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Show as the main story on the homepage, name: featured, widget: boolean, default: false }
      - { label: "Draft (hide from the website)", name: draft, widget: boolean, default: false }
      - label: Article text
        name: body
        widget: markdown
        hint: "Use the toolbar: H2/H3 headings, lists, quotes, links. The + button adds images (add a caption in the Title box) and YouTube videos."
        editor_components: [image, code-block, youtube]
